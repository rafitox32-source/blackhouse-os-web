<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cámara del Celular | BlackHouse OS</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/icon-512.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #preview {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }
        .capa {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            padding-top: calc(16px + env(safe-area-inset-top));
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            pointer-events: none;
        }
        .estado {
            align-self: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            padding: 12px 20px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: center;
        }
        .estado.conectado { color: #10b981; }
        .estado.error { color: #f87171; }
        .punto {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: #f59e0b;
            animation: parpadeo 1s infinite;
        }
        .punto.ok { background: #10b981; animation: none; }
        @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .botonera {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            pointer-events: all;
        }
        .btn-flip {
            background: rgba(255,255,255,0.14);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            padding: 12px 22px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-flip.activo {
            background: rgba(245,158,11,0.35);
            border-color: rgba(245,158,11,0.6);
        }
        .zoom-wrap {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.14);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 999px;
            padding: 8px 16px;
            pointer-events: all;
            color: #fff;
            font-size: 13px;
        }
        .zoom-wrap input[type="range"] {
            width: 110px;
        }
        .marca {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top));
            left: 16px;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.04em;
        }
        .marca span { color: #7c3aed; }
    </style>
</head>
<body>
    <video id="preview" autoplay muted playsinline webkit-playsinline></video>
    <div class="marca">BlackHouse<span>OS</span></div>
    <div class="capa">
        <div id="estado" class="estado"><span class="punto"></span> Iniciando cámara...</div>
        <div class="botonera">
            <button class="btn-flip" onclick="voltearCamara()">🔄 Cambiar cámara</button>
            <button class="btn-flip" id="btn-torch" onclick="alternarTorch()" style="display:none;">🔦 Flash</button>
            <div class="zoom-wrap" id="zoom-wrap">
                🔍 <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1" oninput="cambiarZoom(this.value)">
            </div>
        </div>
        <div class="botonera" style="margin-top:10px;">
            <button class="btn-flip" id="btn-foto-imei" onclick="tomarFotoImei()" style="background:rgba(124,58,237,0.35); border-color:rgba(124,58,237,0.6);">
                📸 Foto para IMEI (alta calidad)
            </button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const room = params.get('room');
        const preview = document.getElementById('preview');
        const estadoEl = document.getElementById('estado');

        let supabaseClient, canal, pc, streamActual;
        let usandoTrasera = true;
        let torchActivo = false;

        function setEstado(html, clase) {
            estadoEl.className = 'estado' + (clase ? ' ' + clase : '');
            estadoEl.innerHTML = html;
        }

        async function initSupabase() {
            if (supabaseClient) return supabaseClient;
            const res = await fetch('/api/config');
            const config = await res.json();
            supabaseClient = supabase.createClient(config.url, config.key);
            return supabaseClient;
        }

        async function abrirCamara(trasera) {
            if (streamActual) streamActual.getTracks().forEach(t => t.stop());
            streamActual = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: trasera ? { ideal: 'environment' } : { ideal: 'user' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                audio: false
            });
            preview.srcObject = streamActual;
            actualizarControlesCamara();
            aplicarCalidadEnvioVideo();
            return streamActual;
        }

        // Sin esto, WebRTC baja la resolución/bitrate solo si cree que la red está floja —
        // incluso en la misma red WiFi — y la imagen que llega a la PC se ve mucho peor que
        // la que se ve en la pantalla del celular. "maintain-resolution" le dice que prefiera
        // bajar cuadros por segundo antes que nitidez, que es justo lo que hace falta para leer
        // bien un código de barras o un IMEI (no hace falta que se mueva fluido, sí que se lea).
        async function aplicarCalidadEnvioVideo() {
            if (!pc) return;
            const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
            if (!sender) return;
            try {
                const params = sender.getParameters();
                if (!params.encodings || !params.encodings.length) params.encodings = [{}];
                params.encodings[0].maxBitrate = 4_000_000;
                params.degradationPreference = 'maintain-resolution';
                await sender.setParameters(params);
            } catch (e) {
                console.warn('No se pudo fijar la calidad de envío del video:', e);
            }
        }

        // El flash y el zoom (si el celular los soporta) ayudan mucho a que la camara
        // enfoque bien codigos de barras/texto chico e impreso en cajas oscuras o borrosas.
        function actualizarControlesCamara() {
            torchActivo = false;
            const btnTorch = document.getElementById('btn-torch');
            const zoomWrap = document.getElementById('zoom-wrap');
            btnTorch.textContent = '🔦 Flash';
            btnTorch.classList.remove('activo');
            btnTorch.style.display = 'none';
            zoomWrap.style.display = 'none';

            const track = streamActual && streamActual.getVideoTracks()[0];
            if (!track || !track.getCapabilities) return;
            const capacidades = track.getCapabilities();

            if (capacidades.torch) btnTorch.style.display = 'flex';

            if (capacidades.zoom) {
                const slider = document.getElementById('zoom-slider');
                slider.min = capacidades.zoom.min;
                slider.max = capacidades.zoom.max;
                slider.step = capacidades.zoom.step || 0.1;
                slider.value = capacidades.zoom.min;
                zoomWrap.style.display = 'flex';
            }
        }

        async function alternarTorch() {
            const track = streamActual && streamActual.getVideoTracks()[0];
            if (!track) return;
            torchActivo = !torchActivo;
            try {
                await track.applyConstraints({ advanced: [{ torch: torchActivo }] });
                const btn = document.getElementById('btn-torch');
                btn.textContent = torchActivo ? '🔦 Apagar flash' : '🔦 Flash';
                btn.classList.toggle('activo', torchActivo);
            } catch (e) {
                torchActivo = false;
                console.error('No se pudo controlar el flash:', e);
            }
        }

        async function cambiarZoom(valor) {
            const track = streamActual && streamActual.getVideoTracks()[0];
            if (!track) return;
            try {
                await track.applyConstraints({ advanced: [{ zoom: parseFloat(valor) }] });
            } catch (e) {
                console.error('No se pudo aplicar el zoom:', e);
            }
        }

        // El video en vivo va comprimido para verse fluido, no para leer texto/códigos chicos
        // (en iPhone, Safari limita más la resolución de un video de WebRTC que Chrome/Android).
        // Esto en cambio toma una FOTO FIJA con la cámara a su calidad real y la manda por el
        // mismo canal de Supabase Realtime que ya existe para el emparejamiento — en trozos,
        // porque una foto en base64 no entra en un solo mensaje.
        let capturandoFotoImei = false;
        async function tomarFotoImei() {
            if (capturandoFotoImei || !streamActual || !canal) return;
            capturandoFotoImei = true;
            const btn = document.getElementById('btn-foto-imei');
            const textoOriginal = btn.textContent;
            btn.disabled = true;
            btn.textContent = '📸 Enviando...';
            try {
                const track = streamActual.getVideoTracks()[0];
                let bitmap;
                if ('ImageCapture' in window) {
                    const captura = new ImageCapture(track);
                    try {
                        const blob = await captura.takePhoto();
                        bitmap = await createImageBitmap(blob);
                    } catch (e) {
                        bitmap = await captura.grabFrame();
                    }
                } else {
                    bitmap = await createImageBitmap(preview);
                }

                const maxLado = 2000;
                const escala = Math.min(1, maxLado / Math.max(bitmap.width, bitmap.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(bitmap.width * escala);
                canvas.height = Math.round(bitmap.height * escala);
                canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
                const blobFinal = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.82));

                const base64 = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(blobFinal);
                });

                const TAMANO_TROZO = 48000;
                const total = Math.ceil(base64.length / TAMANO_TROZO);
                const id = Date.now().toString(36);

                await canal.send({ type: 'broadcast', event: 'foto-imei-inicio', payload: { id, total } });
                for (let i = 0; i < total; i++) {
                    const trozo = base64.slice(i * TAMANO_TROZO, (i + 1) * TAMANO_TROZO);
                    await canal.send({ type: 'broadcast', event: 'foto-imei-trozo', payload: { id, indice: i, datos: trozo } });
                }
                await canal.send({ type: 'broadcast', event: 'foto-imei-fin', payload: { id } });

                setEstado('<span class="punto ok"></span> Foto enviada — revisa la PC', 'conectado');
                setTimeout(() => {
                    if (pc && pc.connectionState === 'connected') {
                        setEstado('<span class="punto ok"></span> Conectado — la PC ya ve tu cámara', 'conectado');
                    }
                }, 2500);
            } catch (e) {
                console.error('Error tomando/enviando la foto:', e);
                setEstado('⚠️ No se pudo tomar/enviar la foto: ' + e.message, 'error');
            } finally {
                capturandoFotoImei = false;
                btn.disabled = false;
                btn.textContent = textoOriginal;
            }
        }

        async function voltearCamara() {
            usandoTrasera = !usandoTrasera;
            try {
                const nuevoStream = await abrirCamara(usandoTrasera);
                if (pc) {
                    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) await sender.replaceTrack(nuevoStream.getVideoTracks()[0]);
                }
            } catch (e) {
                setEstado('⚠️ No se pudo cambiar de cámara', 'error');
            }
        }

        async function iniciar() {
            if (!room) {
                setEstado('⚠️ Link inválido: falta el código de la sala.', 'error');
                return;
            }

            try {
                await abrirCamara(usandoTrasera);
            } catch (e) {
                setEstado('⚠️ No se pudo acceder a la cámara: ' + e.message, 'error');
                return;
            }

            setEstado('<span class="punto"></span> Conectando con la computadora...');

            const client = await initSupabase();
            const roomName = 'celular_camara_' + room;
            canal = client.channel(roomName);

            pc = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            });
            streamActual.getTracks().forEach(track => pc.addTrack(track, streamActual));
            aplicarCalidadEnvioVideo();

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    canal.send({ type: 'broadcast', event: 'ice-candidate-celular', payload: { candidate: event.candidate } });
                }
            };

            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'connected') {
                    setEstado('<span class="punto ok"></span> Conectado — la PC ya ve tu cámara', 'conectado');
                } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                    setEstado('⚠️ Se perdió la conexión con la PC', 'error');
                }
            };

            let respondido = false;
            let intentoOferta = null;

            canal
                .on('broadcast', { event: 'answer' }, async (payload) => {
                    respondido = true;
                    if (intentoOferta) { clearInterval(intentoOferta); intentoOferta = null; }
                    try {
                        await pc.setRemoteDescription(new RTCSessionDescription(payload.payload.answer));
                    } catch (e) { console.error(e); }
                })
                .on('broadcast', { event: 'ice-candidate-pc' }, async (payload) => {
                    if (payload.payload.candidate) {
                        try { await pc.addIceCandidate(new RTCIceCandidate(payload.payload.candidate)); }
                        catch (e) { console.error(e); }
                    }
                })
                .subscribe(async (status) => {
                    if (status !== 'SUBSCRIBED') return;

                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    setEstado('<span class="punto"></span> Esperando respuesta de la PC...');

                    // La PC puede tardar un instante en terminar de suscribirse a este
                    // mismo canal; si la oferta se manda justo antes, se pierde (los
                    // mensajes "broadcast" no quedan guardados para quien se suscribe
                    // despues). Para no depender de esa carrera de tiempos, se reintenta
                    // mandar la oferta cada 1.5s hasta recibir respuesta (maximo ~15s).
                    let intentos = 0;
                    const enviarOferta = async () => {
                        if (respondido) return;
                        intentos++;
                        await canal.send({ type: 'broadcast', event: 'offer', payload: { offer } });
                        if (intentos >= 10 && intentoOferta) { clearInterval(intentoOferta); intentoOferta = null; }
                    };
                    await enviarOferta();
                    intentoOferta = setInterval(enviarOferta, 1500);
                });
        }

        iniciar();

        // Evita que la pantalla se apague sola mientras esta pantalla esta abierta
        // (si el navegador lo soporta); no es critico si falla.
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(() => {});
        }
    </script>
</body>
</html>
